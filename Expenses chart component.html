<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expenses chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="balance">
      <div>
        <p class="balance__label" id="balance-label">My balance</p>
        <p class="balance__amount" id="balance-amount">$0.00</p>
      </div>
      <a class="balance__logo" href="#" aria-label="Account details">
        <svg viewBox="0 0 72 48" width="56" height="38" aria-hidden="true">
          <circle cx="24" cy="24" r="20" fill="none" stroke="#fff" stroke-width="4"/>
          <ellipse cx="48" cy="24" rx="12" ry="20" fill="#fff"/>
        </svg>
      </a>
    </header>

    <section class="card" aria-labelledby="chart-title">
      <div class="card__head">
        <h1 class="card__title" id="chart-title">Spending - Last 7 days</h1>
        <ul class="legend" aria-label="Chart key">
          <li><span class="legend__dot"></span>Earlier</li>
          <li><span class="legend__dot legend__dot--today"></span>Today</li>
        </ul>
      </div>

      <div class="chart" id="chart" role="list" aria-label="Daily spending"></div>

      <footer class="card__footer">
        <div>
          <p class="card__small" id="summary-label">Total this month</p>
          <p class="card__total" id="summary-amount">$0.00</p>
        </div>
        <div class="card__change">
          <p class="card__delta" id="summary-change">0%</p>
          <p class="card__small" id="summary-change-label">from last month</p>
        </div>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
